    <script>
        // ---------- ✨ 核心功能：控制自定义链接输入框的显隐 ✨ ----------
        // 获取元素
        const selectEl = document.getElementById('select');
        const linkInput = document.getElementById('link');
        const diyOption = document.getElementById('diy');  // 自定义option用于存储自定义值

        /**
         * 切换链接输入框的显示/隐藏
         * 规则：仅当选中 "自定义" 项（value 为空字符串）时显示输入框，否则隐藏
         * 同时，显示时自动填充已保存的自定义地址，隐藏时同步选中的URL到输入框（保证后续逻辑）
         */
        function toggleCustomLinkInput() {
            if (!selectEl || !linkInput) return;
            const isCustom = (selectEl.value === '');  // 自定义选项 value 为空字符串
            
            if (isCustom) {
                // 显示输入框，并填入保存的自定义地址（diy option 的 value）
                linkInput.style.display = 'block';
                linkInput.classList.add('visible');
                const customUrl = diyOption ? diyOption.value : '';
                if (linkInput.value !== customUrl) {
                    linkInput.value = customUrl;
                }
                // 确保自定义模式下，手动输入时切换到自定义选项的逻辑早已存在，无需额外操作
            } else {
                // 隐藏输入框，并且将当前选中选项的url同步到 linkInput.value (保持原有测试逻辑)
                linkInput.style.display = 'none';
                linkInput.classList.remove('visible');
                const selectedUrl = selectEl.options[selectEl.selectedIndex]?.value || '';
                if (linkInput.value !== selectedUrl) {
                    linkInput.value = selectedUrl;
                }
            }
        }

        /**
         * 处理 select 变化：既要保留原有的值同步 + cookie存储，也要控制显隐
         * 原 onchange 逻辑扩展
         */
        function handleSelectChange(selectDom) {
            // 1. 原有逻辑: 更新输入框值为当前选中项
            const selectedUrl = selectDom.options[selectDom.selectedIndex].value;
            document.getElementById('link').value = selectedUrl;
            // 2. 保存 cookie 选中的索引
            setCookie('select', selectDom.selectedIndex, 365);
            // 3. 控制显示隐藏 (自定义时显示输入框)
            toggleCustomLinkInput();
        }

        /**
         * 处理自定义输入框的手动输入
         * 当用户在输入框中编辑时，自动切换到“自定义”模式，存储自定义链接，并保存 cookie
         * 原本 oninput 逻辑扩展，同时保证显示状态
         */
        function handleCustomInput(inputDom) {
            // 强制将选中索引改为自定义 (索引0)
            if (selectEl.selectedIndex !== 0) {
                selectEl.selectedIndex = 0;
                // 同步更新select样式、保存cookie的索引
                setCookie('select', 0, 365);
            }
            // 将用户输入的地址保存到 diy option 的 value 中，并保存 cookie
            const customVal = inputDom.value;
            if (diyOption) diyOption.value = customVal;
            setCookie('diy', customVal, 365);
            // 确保输入框可见并且值同步（但本身就是可见状态，以防万一）
            if (linkInput.style.display !== 'block') {
                linkInput.style.display = 'block';
                linkInput.classList.add('visible');
            }
            // 注意：不要递归触发 toggle，但状态已经正确。
        }

        // 覆盖或增强原有的 setCookie / getCookie (保留原有实现，保证兼容)
        // 下面的 setCookie, getCookie 与原版定义一致，只是确保不冲突（原版已存在相同函数，但重写无妨）
        // 不过原脚本后面还有定义，为了避免重复，先检查是否存在，不存在再定义。但为了保险，此处使用已经存在的函数，不需要重新定义。
        // 由于原始代码后面script有setCookie/getCookie定义，目前只保证不覆盖，因为我们调用 setCookie 是全局可见的。
        // 为了确保初始化时能正确加载，需要等待 DOM 完全解析后再进行初始化操作。
        
        // 保存原始函数的引用（防止覆盖，但无需操心，只要在现有基础上执行初始化即可）
        // 修复初始化逻辑: 根据cookie恢复选择后，同步显隐状态，并修复自定义模式下的link值
        function initializeLinkVisibility() {
            if (!selectEl || !linkInput) return;
            // 恢复自定义地址 (diy option 的值)
            const savedDiy = getCookie('diy');
            if (savedDiy && diyOption) {
                diyOption.value = savedDiy;
            }
            // 恢复选择的索引
            const savedSelectIndex = getCookie('select');
            if (savedSelectIndex !== "" && !isNaN(parseInt(savedSelectIndex))) {
                const idx = parseInt(savedSelectIndex);
                if (idx >= 0 && idx < selectEl.options.length) {
                    selectEl.selectedIndex = idx;
                } else {
                    selectEl.selectedIndex = 0;
                }
            } else {
                // 默认百度CDN被选中，但需保持预设的selected属性，但我们确保索引正确：默认百度CDN对应索引1（因为有自定义打头）
                if (selectEl.selectedIndex === -1) selectEl.selectedIndex = 1;
            }
            
            // 核心: 如果当前选项是自定义，需要把 link 的值设置为 diyOption 保存的地址；
            // 如果不是自定义，需要同步选中链接的值到输入框，并隐藏
            const isCustomNow = (selectEl.value === '');
            if (isCustomNow) {
                // 显示输入框，并把自定义历史值填入
                linkInput.style.display = 'block';
                linkInput.classList.add('visible');
                const customUrl = diyOption ? diyOption.value : '';
                linkInput.value = customUrl;
            } else {
                // 非自定义，隐藏输入框，并同步选中链接值
                linkInput.style.display = 'none';
                linkInput.classList.remove('visible');
                const selectedUrl = selectEl.options[selectEl.selectedIndex]?.value || '';
                linkInput.value = selectedUrl;
            }
        }
        
        // 为了保证原有页面加载完毕后原有初始化逻辑（getCookie设置select等）完成，我们需要等待 a moment
        // 原有代码在下面 script 标签中也有初始化（设置在全局的 document.getElementById('diy').value = getCookie("diy"); 等）
        // 为避免冲突，我们等待页面完全加载后执行修正，并保证自定义显隐优先。
        // 另外原生的 onload 可能会被覆盖，使用 DOMContentLoaded 确保顺序。
        window.addEventListener('DOMContentLoaded', function() {
            // 延迟一点点，保证原有的 cookie 恢复已经作用于 dom（原有脚本顺序在下面执行时）
            // 但是因为我们的 script 标签位于页面较前位置，后面还有初始化脚本（原来的脚本段在下方以及 main.js等）
            // 为了让最终效果正确，使用 setTimeout 略微推迟，待所有原生初始化代码完成后再次修正显隐逻辑。
            setTimeout(() => {
                initializeLinkVisibility();
                // 额外监听 select 变更（确保任何通过代码触发的变化都能更新显隐）但是原有 select 的 onchange 已包含 handleSelectChange
                // 如果未来有其他 JS 修改 selectedIndex 没有触发 change，可以加 MutationObserver，但现有功能足够。
                // 同时监听线程调整等其他不变，无影响。
            }, 50);
        });
        
        // 保留原始 musiccontrol 等原有函数，避免缺失定义，下面会沿用原有。
        // 为了确保原有函数仍然可用，且不破坏任何逻辑，我们把原脚本的剩余函数（show, musiccontrol等）保留原样。
        // 但为了不重复导致覆盖，注意原页面底部有大量 script，它们会正常加载。
        // 在这里添加额外必要的辅助函数（如果原来没有定义 show/setCookie 则会重复，但原有存在，故不再重复覆盖）。
        // 由于底部的 setCookie/getCookie 依然存在，安全起见，我们不再重写。直接调用自身已经定义的即可。
        
        // 但是为了某些情况下可能丢失 setCookie 的引用，但绝大部分已存在，没问题。
        // 我们应确保所有的原有函数全局可用，并且不对原有功能产生副作用。
        
        // 为应付可能的额外场景，手动暴露保证 cookie 函数存在 (以防执行顺序问题)
        if (typeof setCookie !== 'function') {
            window.setCookie = function(cname, cvalue, exdays) {
                var d = new Date();
                d.setTime(d.getTime() + (exdays * 24 * 60 * 60 * 1000));
                var expires = "expires=" + d.toGMTString();
                document.cookie = cname + "=" + cvalue + "; " + expires;
            };
        }
        if (typeof getCookie !== 'function') {
            window.getCookie = function(cname) {
                var name = cname + "=";
                var ca = document.cookie.split(';');
                for (var i = 0; i < ca.length; i++) {
                    var c = ca[i].trim();
                    if (c.indexOf(name) == 0) return c.substring(name.length, c.length);
                }
                return "";
            };
        }
        
        // 注意: 原有的 show, musiccontrol, botton_clicked 等函数均在 main.js?5 或其他外部脚本中定义，我们保留即可。
        // 为了适应主题切换等，全局环境维持不变。
        // 另外需要保留原有的 lastTouchEnd 逻辑，原先已存在，保留。
    </script>
    <!-- 原有的剩余脚本（保留完全一致的功能，同时确保自定义显隐增强生效） -->
    <script>
        var lastTouchEnd = 0
        if (!!('ontouchstart' in window || navigator.maxTouchPoints)) {
            document.documentElement.addEventListener(
                'touchend',
                function (event) {
                    var now = Date.now()
                    if (now - lastTouchEnd <= 300) {
                        event.preventDefault()
                    }
                    lastTouchEnd = now
                }, {
                passive: false
            }
            )
        }

        function show(num, des, flo) {
            var cnum = num;
            var total_index = 0;
            while (cnum >= 1024) {
                if (total_index == des.length - 1) break;
                cnum = cnum / 1024;
                total_index++;
            }
            return cnum.toFixed(flo[total_index]) + des[total_index];
        }

        function musiccontrol(botton) {
            if (/Mobi|Android|iPhone/i.test(navigator.userAgent)) {
                if (document.getElementById("customSwitch2").checked) document.getElementById("music").play()
                else document.getElementById("music").pause()
            }
        }
        document.getElementById("music").addEventListener("pause", function () {
            document.title = '流量消耗器'
            if (run && !visibl) botton_clicked()
            document.getElementById("customSwitch2").checked = false
        })
        document.getElementById("music").addEventListener("play", function () {
            if (!(run || visibl)) botton_clicked()
            document.getElementById("customSwitch2").checked = true
        })

        function setCookie(cname, cvalue, exdays) {
            var d = new Date();
            d.setTime(d.getTime() + (exdays * 24 * 60 * 60 * 1000));
            var expires = "expires=" + d.toGMTString();
            document.cookie = cname + "=" + cvalue + "; " + expires;
        }

        function getCookie(cname) {
            var name = cname + "=";
            var ca = document.cookie.split(';');
            for (var i = 0; i < ca.length; i++) {
                var c = ca[i].trim();
                if (c.indexOf(name) == 0) return c.substring(name.length, c.length);
            }
            return "";
        }
        document.getElementById('diy').value = getCookie("diy");
        if (getCookie("select")) document.getElementById('select').selectedIndex = getCookie("select");
        var selector = document.getElementById("select");
        document.getElementById('link').value = selector.options[selector.selectedIndex].value;

        var Maximum = 0
        setMax(getCookie('Max'))

        function setMax(inputMax) {
            if (inputMax > 0) {
                setCookie("Max", inputMax, 365)
                Maximum = inputMax * 1073741824
                document.getElementById("showMax").innerText = '/' + show(Maximum, ['B', 'KB', 'MB', 'GB', 'TB', 'PB'], [0, 0, 1, 2, 2, 2])
            } else {
                Maximum = 0
                document.getElementById("showMax").innerText = ''
                setCookie("Max", 0, 365)
            }
        }
    </script>

    <script>
        const ipTargets = [
            { id: 'ipcn_v4', url: 'https://v4.ipgg.cn' },
            { id: 'ipcn_v6', url: 'https://v6.ipgg.cn' },
            { id: 'ipgb_v4', url: 'https://v4.wuxie.de' },
            { id: 'ipgb_v6', url: 'https://v6.wuxie.de' }
        ];

        ipTargets.forEach(target => {
            fetch(target.url)
                .then(response => {
                    if (!response.ok) throw new Error('Network response was not ok');
                    return response.text();
                })
                .then(text => {
                    document.getElementById(target.id).innerText = text.trim();
                })
                .catch(error => {
                    document.getElementById(target.id).innerText = 'NULL';
                    console.error('Fetching IP failed:', error);
                });
        });
        // 最后再次确保自定义链接框显隐（原脚本设置完 link 的 value 后二次对齐）
        setTimeout(() => {
            const sel = document.getElementById('select');
            const link = document.getElementById('link');
            if (sel && link) {
                const isCustom = (sel.value === '');
                if (isCustom) {
                    link.style.display = 'block';
                    const customVal = document.getElementById('diy')?.value || '';
                    if (link.value !== customVal) link.value = customVal;
                } else {
                    link.style.display = 'none';
                }
            }
        }, 100);
    </script>
